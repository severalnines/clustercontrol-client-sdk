openapi: 3.0.1
info:
  contact:
    email: sales@severalnines.com
  description: REST API (V2) specification for ClusterControl - AI Powered Database
    automation tool for multi/hybrid cloud database deployment.
  termsOfService: https://severalnines.com/terms/
  title: Severalnines ClusterControl REST API (V2)
  version: OpenAPI specification v1.0.0
externalDocs:
  description: Find out more about ClusterControl
  url: https://docs.severalnines.com/docs/clustercontrol/
servers:
- url: https://cchost:9501/v2
paths:
  /auth:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Authenticate"
        description: Authentication parameters
        required: true
      responses:
        "200":
          content: {}
          description: Successful authentication
        "405":
          content: {}
          description: Invalid input
      summary: Authenticate | Logout | Password Reset | Authenticate response (with
        challenge)
      tags:
      - auth
  /alarm:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Alarm"
        description: All things related to Alarms and Stats
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmResponse"
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetStatistics | GetAlarm | GetAlarms | IgnoreAlarm
      tags:
      - alarms
  /audit:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Audit"
        description: Used to get the audit log entries
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetStatistics | GetAlarm | GetAlarms | IgnoreAlarm
      tags:
      - audit
  /backup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Backup"
        description: All things related to Backups
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetBackups | GetBackupSchedules | ScheduleBackup | DeleteBackupRecord
      tags:
      - backup
  /cloud:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cloud"
        description: calls to manage the cloud-credentials
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: VerifyCredentials | ListCredentials | etc
      tags:
      - cloud
  /clusters:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Clusters"
        description: Get cluster information
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetClusterInfo | Get/Set Config | etc
      tags:
      - clusters
  /config:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
        description: Provides access to various Cmon configuration files
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetConfig | xxx | xxx | etc
      tags:
      - config
  /controller:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Controller"
        description: Managing controller and operate the Cmon HA subsystem
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: Ping | Heartbeat | etc
      tags:
      - controller
  /discovery:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Discovery"
        description: All things related to Clusters and cluster Hosts
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: CheckClusterName | CheckHosts | GetSupportedClusterTypes
      tags:
      - discovery
  /host:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Host"
        description: "(Un)Register servers, Shutdown servers, etc"
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: Path for managing servers
      tags:
      - host
  /jobs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Jobs"
        description: "Creating, manipulating, and obtaining information about jobs"
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: CreateJobInstance | etc
      tags:
      - jobs
  /maintenance:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Maintenance"
        description: "Creating, deleting and obtaining maintenance periods"
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: Set a maintenance window for a managed database cluster
      tags:
      - maintenance
  /reports:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reports"
        description: Provides access to reports generated by the Cmon controller
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GenerateReport | etc
      tags:
      - reports
  /stat:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Stat"
        description: Provides calls to access various statistical information about
          the cluster
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetInfo | etc
      tags:
      - stat
  /stat/cmonagent:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatCmonAgent"
        description: Provides calls to access various statistical information about
          the cluster
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetInfo | etc
      tags:
      - statCmonAgent
  /stat/prometheus/query:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatPrometheus"
        description: Provides calls to access various statistical information about
          the cluster
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: GetInfo | etc
      tags:
      - statPrometheus
  /users:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Users"
        description: "Manipulate Cmon Users, users that are maintained by the Cmon\
          \ controller"
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: CreateUser | etc
      tags:
      - users
  /tree:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tree"
        description: Manipulate ACLs for Groups and Users that are maintained by the
          Cmon controller
        required: true
      responses:
        "200":
          content: {}
          description: Successful operation
        "405":
          content: {}
          description: Unauthorized
      summary: AddACL | RemoveAcl | etc
      tags:
      - tree
components:
  schemas:
    Authenticate:
      example:
        operation: authenticateWithPassword
        user_name: user_name
        password: password
        signature: signature
        new_password: new_password
        password_reset_token: password_reset_token
      properties:
        operation:
          enum:
          - authenticateWithPassword
          - authenticate
          - authenticateresponse
          - logout
          - passwordReset
          - newpassword
          type: string
        user_name:
          type: string
        password:
          type: string
        signature:
          type: string
        new_password:
          type: string
        password_reset_token:
          type: string
      required:
      - operation
      type: object
    Alarm:
      example:
        operation: getStatistics
        cluster_id: 0
        alarm_id: 6
        class_name: CmonRpcRequest
        ignore: true
      properties:
        operation:
          enum:
          - getStatistics
          - getAlarm
          - getAlarms
          - ignoreAlarm
          type: string
        cluster_id:
          type: integer
        alarm_id:
          type: integer
        class_name:
          enum:
          - CmonRpcRequest
          type: string
        ignore:
          type: boolean
      required:
      - operation
      type: object
    AlarmResponse:
      example:
        operation: getStatistics
        cluster_id: 0
        alarm_id: 6
        class_name: CmonRpcRequest
        ignore: true
      properties:
        operation:
          enum:
          - getStatistics
          - getAlarm
          - getAlarms
          - ignoreAlarm
          type: string
        cluster_id:
          type: integer
        alarm_id:
          type: integer
        class_name:
          enum:
          - CmonRpcRequest
          type: string
        ignore:
          type: boolean
      type: object
    Audit:
      example:
        operation: getEntries
        cluster_ids:
        - 0
        - 0
        ascending: true
      properties:
        operation:
          enum:
          - getEntries
          type: string
        cluster_ids:
          items:
            type: integer
          type: array
        ascending:
          type: boolean
      required:
      - operation
      type: object
    Backup:
      example:
        operation: getBackups
        cluster_id: 0
        ascending: true
        order: order
        backup_record_version: 6
        limit: 1
        offset: 5
        schedule:
          class_name: CmonBackupSchedule
          enabled: true
          schedule: schedule
          schedule_id: 5
          job:
            command: backup
            job_data:
              description: description
              backup_failover: true
              backup_failover_host: auto
              backup_method: pg_basebackup
              backup_retention: 2
              backupdir: backupdir
              backupsubdir: backupsubdir
              cc_storage: true
              compression: true
              compresion_level: 7
              encrypt_backup: true
              hostname: hostname
              port: 9
              verify_backup_delay: 3
              verify_backup:
                disable_firewall: true
                disable_selinux: true
                install_software: true
                server_address: server_address
                terminate_db_server: true
        backup_record:
          backup_id: 2
      properties:
        operation:
          enum:
          - getBackups
          - getBackupSchedules
          - scheduleBackup
          - deleteBackupRecord
          type: string
        cluster_id:
          type: integer
        ascending:
          type: boolean
        order:
          type: string
        backup_record_version:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        schedule:
          $ref: "#/components/schemas/Backup_schedule"
        backup_record:
          $ref: "#/components/schemas/Backup_backup_record"
      required:
      - operation
      type: object
    BackupResponse:
      properties:
        backup_records:
          items:
            $ref: "#/components/schemas/BackupResponse_backup_records_inner"
          type: array
      type: object
    Cloud:
      example:
        operation: verifyCredentials
        provider: provider
        name: name
        comment: comment
        id: 0
        credentials:
          access_key_id: access_key_id
          access_key_secret: access_key_secret
          access_key_region: access_key_region
      properties:
        operation:
          enum:
          - verifyCredentials
          - listCredentials
          - getCredentials
          - addCredentials
          - updateCredentials
          - removeCredentials
          type: string
        provider:
          type: string
        name:
          type: string
        comment:
          type: string
        id:
          type: integer
        credentials:
          $ref: "#/components/schemas/Cloud_credentials"
      required:
      - operation
      type: object
    Clusters:
      example:
        operation: getallclusterinfo
        cluster_id: 0
        cluster_name: cluster_name
        with_hosts: true
        with_sheet_info: true
        configuration:
        - name: name
          value: value
        - name: name
          value: value
        account:
          class_name: CmonAccount
          grants: grants
          host_allow: host_allow
          own_database: own_database
          privileges: privileges
          user_name: user_name
          password: password
        filter_strings: filter_strings
        limit: 6
        offset: 1
        database:
          class_name: CmonDataBase
          database_name: database_name
        nodes:
        - nodes
        - nodes
      properties:
        operation:
          enum:
          - getallclusterinfo
          - getclusterinfo
          - getConfig
          - setConfig
          - createAccount
          - getAccounts
          - deleteAccount
          - grantPrivileges
          - revokePrivileges
          - revokeAllPrivileges
          - getSqlProcesses
          - getTopQueries
          - createDatabase
          - ping
          - availableUpgrades
          type: string
        cluster_id:
          type: integer
        cluster_name:
          type: string
        with_hosts:
          type: boolean
        with_sheet_info:
          type: boolean
        configuration:
          items:
            $ref: "#/components/schemas/Clusters_configuration_inner"
          type: array
        account:
          $ref: "#/components/schemas/Clusters_account"
        filter_strings:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        database:
          $ref: "#/components/schemas/Clusters_database"
        nodes:
          items:
            description: List of nodes (hosts) to query available package upgrades
              on
            type: string
          type: array
      required:
      - operation
      type: object
    ClusterResponse:
      properties:
        class_name:
          type: string
        operation:
          type: string
        cluster_id:
          type: integer
        cluster_name:
          type: string
        cluster_type:
          type: string
        vendor:
          type: string
        version:
          type: string
        tags:
          items:
            type: string
          type: array
        hosts:
          items:
            $ref: "#/components/schemas/ClusterResponse_hosts_inner"
          type: array
      type: object
    Config:
      example:
        operation: getConfig
        hostname: hostname
        port: 0
        configuration:
        - name: name
          value: value
          group: group
        - name: name
          value: value
          group: group
        ldap_configuration:
          enabled: true
          ldapAdminPassword: ldapAdminPassword
          ldapAdminUser: ldapAdminUser
          ldapGroupSearchRoot: ldapGroupSearchRoot
          ldapServerUri: ldapServerUri
          ldapUserSearchRoot: ldapUserSearchRoot
          groupMappings:
          - cmonGroupName: cmonGroupName
            ldapGroupId: ldapGroupId
            sectionName: sectionName
          - cmonGroupName: cmonGroupName
            ldapGroupId: ldapGroupId
            sectionName: sectionName
          ldapSettings:
            ldapEmailAttributes: ldapEmailAttributes
            ldapGroupClassName: ldapGroupClassName
            ldapGroupIdAttributes: ldapGroupIdAttributes
            ldapGroupNameAttribute: ldapGroupNameAttribute
            ldapMemberAttributes: ldapMemberAttributes
            ldapNetworkTimeout: ldapNetworkTimeout
            ldapProtocolVersion: ldapProtocolVersion
            ldapQueryTimeLimit: ldapQueryTimeLimit
            ldapRealnameAttributes: ldapRealnameAttributes
            ldapUserClassName: ldapUserClassName
            ldapUsernameAttributes: ldapUsernameAttributes
          security:
            caCertFile: caCertFile
            certFile: certFile
            keyFile: keyFile
        licensedata: licensedata
      properties:
        operation:
          enum:
          - getConfig
          - setConfig
          - unsetConfig
          - getLdapConfig
          - setLdapConfig
          - setLicense
          - getLicense
          - listTemplates
          type: string
        hostname:
          type: string
        port:
          type: integer
        configuration:
          items:
            $ref: "#/components/schemas/Config_configuration_inner"
          type: array
        ldap_configuration:
          $ref: "#/components/schemas/Config_ldap_configuration"
        licensedata:
          type: string
      required:
      - operation
      type: object
    Controller:
      example:
        operation: ping
        client_ip_address: client_ip_address
        controller_key: controller_key
      properties:
        operation:
          enum:
          - ping
          - heartBeat
          type: string
        client_ip_address:
          type: string
        controller_key:
          type: string
      required:
      - operation
      type: object
    Discovery:
      example:
        operation: checkClusterName
        new_cluster_name: new_cluster_name
        check_if_already_registered: true
        check_job: true
        check_ssh_sudo: true
        nodes:
        - class_name: CmonHost
          host_name: host_name
          port: 0
        - class_name: CmonHost
          host_name: host_name
          port: 0
        job:
          class_name: CmonJobInstance
          job_spec:
            command: create_cluster
            job_data:
              cluster_type: group_replication
              mysql_version: mysql_version
              vendor: vendor
              nodes:
              - class_name: CmonHost
                host_name: host_name
              - class_name: CmonHost
                host_name: host_name
        ssh_credentials:
          class_name: class_name
          user_name: user_name
          password: password
          ssh_keyfile: ssh_keyfile
      properties:
        operation:
          enum:
          - checkClusterName
          - getSupportedClusterTypes
          - checkHosts
          type: string
        new_cluster_name:
          type: string
        check_if_already_registered:
          type: boolean
        check_job:
          type: boolean
        check_ssh_sudo:
          type: boolean
        nodes:
          items:
            $ref: "#/components/schemas/Discovery_nodes_inner"
          type: array
        job:
          $ref: "#/components/schemas/Discovery_job"
        ssh_credentials:
          $ref: "#/components/schemas/Discovery_ssh_credentials"
      required:
      - operation
      type: object
    Host:
      example:
        operation: startServers
        servers:
        - class_name: CmonContainerServer
          hostname: hostname
          cdt_path: cdt_path
        - class_name: CmonContainerServer
          hostname: hostname
          cdt_path: cdt_path
        cluster_id: 0
        dry_run: true
        host:
          class_name: class_name
          hostname: hostname
          port: 6
      properties:
        operation:
          enum:
          - startServers
          - shutdownServers
          - registerServers
          - unregisterServers
          - unregisterHost
          type: string
        servers:
          items:
            $ref: "#/components/schemas/Host_servers_inner"
          type: array
        cluster_id:
          type: integer
        dry_run:
          type: boolean
        host:
          $ref: "#/components/schemas/Host_host"
      required:
      - operation
      type: object
    Jobs:
      description: "Creating and manipulating jobs, reading information about jobs"
      example:
        operation: createJobInstance
        cluster_id: 0
        job_id: 6
        signal: 1
        ascending: true
        limit: 5
        offset: 5
        log_level: log_level
        job:
          class_name: class_name
          title: title
          status: status
          recurrence: recurrence
          tags:
          - tags
          - tags
          job_spec:
            command: rolling_restart
            id: 2
            job_data:
              action: enable
              addnode: true
              admin_username: admin_username
              admin_user: admin_user
              admin_password: admin_password
              audit_events: audit_events
              archive_mode: always
              summarize_wal: true
              archive_dir: archive_dir
              backupid: 7
              backup_id: 9
              build_from_source: true
              cluster_name: cluster_name
              clusterid: 3
              cluster_type: mssql_single
              company_id: company_id
              config_template: config_template
              backup_failover: true
              backup_failover_host: auto
              backup_method: pg_basebackup
              backup_mysqldump_type: Complete
              backup_individual_schemas: true
              backup_retention: 2
              extended_insert: true
              backup_dir: backup_dir
              backupsubdir: backupsubdir
              remove_backups: true
              backup_system_db: true
              cc_storage: true
              compression: true
              compression_level: 4
              db_database: db_database
              db_password: db_password
              db_privs: db_privs
              db_username: db_username
              data_center: 7
              exec_upgrade_script: true
              extended: true
              listening_port: 1
              mask_passwords: true
              monitor_password: monitor_password
              monitor_user: monitor_user
              use_clustering: true
              use_rw_split: true
              hostname: hostname
              master_address: master_address
              master_delay: 1
              include_databases: include_databases
              install_timescaledb: true
              update_lb: true
              usePackageForDataDir: true
              encrypt_backup: true
              throttle_rate_netbw: 1
              use_pigz: true
              use_qpress: true
              wsrep_desync: true
              galera_segment: galera_segment
              xtrabackup_backup_locks: true
              xtrabackup_lock_ddl_per_table: true
              xtrabackup_parallellism: 6
              verify_backup_delay: 7
              datadir: datadir
              db_user: db_user
              disable_firewall: true
              disable_selinux: true
              enable_uninstall: true
              unregister_only: true
              generate_token: true
              install_software: true
              use_internal_repos: true
              local_repository: local_repository
              enable_mysql_uninstall: true
              mysql_semi_sync: true
              enable_ssl: true
              mongos_conf_template: mongos_conf_template
              mongodb_authdb: mongodb_authdb
              node_type: 1
              overwrite_mysqlchk: true
              port: 4
              sentinel_port: sentinel_port
              redis_sharded_port: 5
              valkey_sharded_port: 9
              redis_sharded_bus_port: 9
              valkey_sharded_bus_port: 6
              redis_cluster_replica_validity_factor: 8
              valkey_cluster_replica_validity_factor: 9
              node_timeout_ms: 6
              ssh_keyfile: ssh_keyfile
              ssh_port: ssh_port
              ssh_user: ssh_user
              sudo_password: sudo_password
              user_id: 3
              vendor: default
              type: postgresql
              version: version
              software_package: software_package
              server_address: server_address
              terminate_db_server: true
              xtrabackup_use_memory: 6
              initial: true
              reboot: true
              slave_address: slave_address
              force: true
              force_stop: true
              stop_timeout: 1
              pitr_stop_time: pitr_stop_time
              pitr_stop_log: pitr_stop_log
              pitr_stop_pos: 2
              host_location_uuid: host_location_uuid
              bootstrap: true
              snapshot_location: snapshot_location
              snapshot_repository: snapshot_repository
              snapshot_repository_type: snapshot_repository_type
              snapshot_host: snapshot_host
              storage_host: storage_host
              replicaset: replicaset
              deploy_agents: true
              upload_backup_data_to_cloud_storage:
                backup_retention: 6
                bucket: bucket
                cloud_storage_credentials_id: 6
                cloud_storage_provider: cloud_storage_provider
                cloud_storage_service: cloud_storage_service
                delete_after_upload: true
              verify_backup:
                disable_firewall: true
                disable_selinux: true
                install_software: true
                server_address: server_address
                terminate_db_server: true
              config_servers:
                rs: rs
                members:
                - hostname: hostname
                  hostname_data: hostname_data
                  hostname_internal: hostname_internal
                  port: port
                - hostname: hostname
                  hostname_data: hostname_data
                  hostname_internal: hostname_internal
                  port: port
              mongos_servers:
              - hostname: hostname
                hostname_data: hostname_data
                hostname_internal: hostname_internal
                port: port
              - hostname: hostname
                hostname_data: hostname_data
                hostname_internal: hostname_internal
                port: port
              node:
                backend_name_ro: backend_name_ro
                backend_name_rw: backend_name_rw
                data_retention: data_retention
                data_retention_size: 5
                hostname: hostname
                hostname_data: hostname_data
